const initial={providers:[['OpenAI · 主账户','API Key · 12 个模型','正常'],['Anthropic · 生产池','API Key · 8 个模型','正常'],['Gemini · 备用账户','API Key · 10 个模型','正常'],['Local AI · 演示节点','本地兼容接口','已暂停']],models:[['gpt-4o','OpenAI · 文本与视觉','正常'],['claude-sonnet','Anthropic · 长上下文','正常'],['gemini-flash','Gemini · 快速响应','正常'],['local-chat','Local AI · 本地推理','正常']],combos:[['智能默认路由','自动选择 · 3 个目标','正常'],['高可用组合','优先级回退 · 2 个目标','正常'],['低成本组合','成本优先 · 3 个目标','正常']],endpoints:[['演示应用密钥','sk-demo-••••••48 · 月限额 $100','正常'],['测试客户端','sk-demo-••••••92 · 月限额 $25','正常']],quota:[['OpenAI · 主账户','月额度 $500 · 已用 64%','正常'],['Anthropic · 生产池','月额度 $300 · 已用 42%','正常'],['Gemini · 备用账户','每分钟 60 次请求','正常']],analytics:[['聊天补全','13,462 次 · 平均 1.2 秒','正常'],['向量嵌入','3,218 次 · 平均 0.4 秒','正常'],['图像理解','1,746 次 · 平均 2.1 秒','正常']],costs:[['研发团队','本月 $148.36 / $250.00','正常'],['产品团队','本月 $89.42 / $120.00','正常'],['测试环境','本月 $31.18 / $50.00','正常']],logs:[['10:42:18 · chat/completions','gpt-4o · 1,024 tokens · $0.006','成功'],['10:41:55 · chat/completions','claude-sonnet · 2,560 tokens · $0.021','成功'],['10:41:12 · embeddings','text-embedding · 512 tokens · $0.001','成功'],['10:40:47 · chat/completions','gemini-flash · 重试后成功','成功']],resilience:[['OpenAI · 熔断器','关闭 · 延迟 420ms','正常'],['Anthropic · 连接冷却','可用 · 延迟 680ms','正常'],['Gemini · 备用路径','就绪 · 最近回退 2 次','正常']],compression:[['轻量压缩','节省 18.4% · 处理 6,284 次','已启用'],['上下文去重','节省 12.1% · 处理 3,104 次','已启用'],['压缩排除规则','图像请求 · 2 条规则','已启用']],cache:[['语义缓存','命中率 36.8% · 2,481 条','已启用'],['媒体缓存','使用 1.2 GB / 5 GB','已启用'],['每日批处理','24 个任务 · 24 已完成','正常']],agents:[['代码助手','代码分析 · 模拟工作流','正常'],['研究助手','信息整理 · 模拟工作流','正常'],['云端智能体','运行配置 · 2 个任务','正常']],protocols:[['MCP 服务','工具 12 项 · Streamable HTTP','正常'],['A2A 服务','技能 4 项 · Agent Card','正常'],['ACP 智能体','示例代理 · 2 个会话','正常']],memory:[['项目偏好','长期记忆 · 12 条记录','正常'],['检索知识库','演示文档 · 48 个片段','正常'],['代码审查技能','示例技能 · 本地配置','已启用']],integrations:[['Webhook','请求事件 · 发送至示例地址','已启用'],['日志导出','JSON 格式 · 模拟目标','已启用'],['CLI 工具','本地客户端配置示例','正常' const key='antaresgateway-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch{data=structuredClone(initial)}let page='overview';let search='';let editIndex=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{notice('浏览器未允许持久保存，本次更改只在当前页面有效。')}}function notice(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(notice.timer);notice.timer=setTimeout(()=>e.classList.add('hidden'),3000)}const catalog=Array.isArray(window.DEMO_CATALOG)?window.DEMO_CATALOG:[];desc.lab='交互体验路由回退、费用估算和上下文清理。';desc.scenario='依次体验提供商、路由、密钥、预算和模拟请求。';desc.catalog='按照正式软件的导航清单浏览各项模块。';function moduleBase(id){if(/context|compression/.test(id))return 'compression';if(/analytics|provider-stats/.test(id))return 'analytics';if(/cost|quota|pricing|radar|free-/.test(id))return 'costs';if(/log|audit|activity|conversation/.test(id))return 'logs';if(/health|resilience|runtime/.test(id))return 'resilience';if(/batch|cache|media/.test(id))return 'cache';if(/settings|proxy/.test(id))return 'settings';if(/mcp|a2a/.test(id))return 'protocols';if(/skill|memory/.test(id))return 'memory';if(/agent|orchestration|conductor|chaos/.test(id))return 'agents';if(/combo|routing/.test(id))return 'combos';if(/model/.test(id))return 'models';if(/provider|service/.test(id))return 'providers';if(/api|endpoint/.test(id))return 'endpoints';return 'integrations'}function selectedModule(){return page.startsWith('module:')?catalog.find(x=>x.id===page.slice(7)):null}function label(id){if(id.startsWith('module:'))return catalog.find(x=>x.id===id.slice(7))?.title||'模块示例';return groups.flatMap(g=>g[1]).find(x=>x[0]===id)?.[1]||'运行概览'}

function overview(){return cards([['今日请求','18,426','↗ 12.8% 较昨日'],['成功率','99.72%','服务运行正常'],['平均延迟','1.24 s','↘ 8.4% 较昨日'],['本月费用','$268.96','预算使用 53.8%']])+`<div class="columns"><section class="panel"><div class="panel-head"><div><h2>请求趋势</h2><p>过去 24 小时 · 模拟数据</p></div><span class="badge">实时示例</span></div>${bars()}</section><section class="panel"><div class="panel-head"><div><h2>提供商状态</h2><p>上游连接概览</p></div><button class="btn" data-page="providers">查看全部</button></div>${[['OpenAI','正常',84],['Anthropic','正常',65],['Gemini','正常',48],['Local AI','已暂停',20]].map(([n,s,w])=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between"><strong>${n}</strong><span class="muted">${s}</span></div><div class="meter"><span style="width:${w}%"></span></div></div>`).join('')}</section></div><section class="panel"><div class="panel-head"><div><h2>最近请求</h2><p>模拟调用记录</p></div><button class="btn" data-page="logs">查看日志</button></div>${table('logs')}</section>`}
function playground(){return `<section class="panel"><div class="panel-head"><div><h2>对话模拟器</h2><p>输入内容后将返回预设示例，未调用真实模型。</p></div><select aria-label="选择演示模型"><option>智能默认路由</option><option>gpt-4o</option><option>claude-sonnet</option><option>gemini-flash</option></select></div><div class="chat" id="chat"><div class="bubble">你好！这里是 AntaresGateway 的演示对话。你可以输入任意问题，体验请求界面。</div></div><form class="chat-form" id="chatForm"><input id="message" placeholder="输入一条演示消息…" aria-label="演示消息" required><button class="btn primary">发送</button></form></section><section class="panel"><h2>演示说明</h2><p class="muted">响应由本地预设文本生成，用于展示界面交互，不代表模型的真实回答或接口可用性。</p></section>`}
function moduleLinks(){const module=selectedModule();if(!module)return '';const id=module.id;const scenario=/^(providers|combos|api-manager|costs-budget|logs)$/.test(id);const lab=/^(combos|combos-live|costs|costs-budget|costs-pricing|context-|compression-|resilience-)/.test(id);return `<div class="actions" style="margin-bottom:16px"><button class="btn" data-page="catalog">← 返回全部模块</button>${scenario?'<button class="btn" data-page="scenario">体验配置与请求流程</button>':''}${lab?'<button class="btn" data-page="lab">打开功能实验室</button>':''}</div>`}function section(){const stats={providers:[['连接总数','4','模拟连接'],['可用连接','3','已就绪'],['关联模型','30','示例目录'],['最近检查','刚刚','模拟状态']],models:[['可用模型','30','模拟目录'],['提供商','4','示例'],['组合','3','路由示例'],['最近更新','今天','模拟数据']],combos:[['组合数量','3','示例'],['活跃目标','8','模拟配置'],['回退次数','12','过去 24 小时'],['成功率','99.8%','模拟数据']],costs:[['本月费用','$268.96','模拟用量'],['月度预算','$500.00','已用 53.8%'],['预计月底','$412.50','模拟预测'],['团队数量','3','示例']],analytics:[['请求总数','18,426','过去 24 小时'],['成功率','99.72%','模拟数据'],['平均延迟','1.24 s','模拟数据'],['Token 总量','8.6 M','模拟数据']]};let summary=stats[page]?cards(stats[page]):'';return moduleLinks()+summary+(selectedModule()?moduleExercise(selectedModule().id):'')+`<section class="panel"><div class="panel-head"><div><h2>${label(page)} · 示例数据</h2><p>${selectedModule()?'以下为此模块的虚构示例；列表操作仅用于演示，不执行真实服务。':'搜索、增删和状态切换仅影响本地演示。'}</p></div><div class="actions"><input class="search" id="search" placeholder="搜索当前模块" aria-label="搜索当前模块" value="${esc(search)}"><button class="btn primary" id="add">新增示例</button></div></div><div id="rows">${table(page,search)}</div></section>${page==='analytics'?`<section class="panel"><h2>请求趋势</h2>${bars()}</section>`:''}`}
function catalogView(){return `<section class="panel"><div class="panel-head"><div><h2>全部模块目录</h2><p>根据当前软件导航整理，共 ${catalog.length} 个入口。点击查看各模块的模拟示例。</p></div><input class="search" id="catalogSearch" placeholder="搜索模块名称" aria-label="搜索模块名称" value="${esc(search)}"></div><div id="catalogItems">${catalogItems(search)}</div></section>`}function catalogItems(query){const items=catalog.filter(x=>(x.title+' '+x.description+' '+x.id).toLowerCase().includes(query.toLowerCase()));return items.length?`<div class="feature-grid">${items.map(x=>`<button type="button" class="feature" data-module="${esc(x.id)}" style="text-align:left;color:inherit;cursor:pointer"><strong>${esc(x.title)}</strong><p>${esc(x.description||'查看此模块的分类演示')}</p><span class="muted">打开模块示例 →</span></button>`).join('')}</div>`:'<div class="empty">没有匹配的模块。</div>'}function render(){nav();const module=selectedModule();if(module&&!Array.isArray(data[page]))data[page]=structuredClone(window.DEMO_FIXTURES?.[module.id]||initial[moduleBase(module.id)]);$('#title').textContent=label(page);$('#subtitle').textContent=module?(module.description||'查看模块相关的分类演示数据。'):desc[page];$('#view').innerHTML=page==='overview'?overview():page==='scenario'?scenarioView():page==='lab'?labView():page==='playground'?playground():page==='catalog'?catalogView():section();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const moduleButton=e.target.closest('[data-module]');if(moduleButton){page='module:'+moduleButton.dataset.module;search='';render();return}const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;search='';render();return}const add=e.target.closest('#add');if(add){editIndex=null;$('#modalTitle').textContent='新增'+label(page)+'示例';$('#form').reset();$('#modal').showModal();return}const edit=e.target.closest('[data-edit]');if(edit){editIndex=Number(edit.dataset.edit);const row=data[page]?.[editIndex];if(!row)return;$('#form').reset();$('#modalTitle').textContent='编辑'+label(page)+'示例';$('#form').elements.name.value=row[0];$('#form').elements.detail.value=row[1];$('#form').elements.status.value=row[2];$('#modal').showModal();return}const toggle=e.target.closest('[data-toggle]');if(toggle){let row=data[page][Number(toggle.dataset.toggle)];if(!row)return;row[2]=/暂停/.test(row[2])?'已启用':'已暂停';save();render();notice('示例状态已更新');return}const remove=e.target.closest('[data-remove]');if(remove){const i=Number(remove.dataset.remove);if(confirm('删除这条演示数据？')){data[page].splice(i,1);save();render();notice('演示数据已删除')}return}});
document.addEventListener('input',e=>{if(e.target.id==='catalogSearch'){search=e.target.value;$('#catalogItems').innerHTML=catalogItems(search)}if(e.target.id==='search'){search=e.target.value;$('#rows').innerHTML=table(page,search)}});document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const input=$('#message'),text=input.value.trim();if(!text)return;const chat=$('#chat');const user=document.createElement('div');user.className='bubble user';user.textContent=text;chat.append(user);const answer=document.createElement('div');answer.className='bubble';answer.textContent='【模拟回复】已收到你的演示请求。网关可以根据配置选择模型、执行路由和记录用量。本回复由演示程序生成。';chat.append(answer);input.value='';return}if(e.target.id==='form'){e.preventDefault();const f=new FormData(e.target);const row=[String(f.get('name')).trim(),String(f.get('detail')).trim(),String(f.get('status'))];if(!row[0]||!row[1]){notice('名称和说明不可为空');return}if(editIndex===null)data[page].push(row);else data[page][editIndex]=row;save();$('#modal').close();render();notice(editIndex===null?'示例已添加':'示例已更新');editIndex=null}});$('#cancel').onclick=()=>$('#modal').close();$('#reset').onclick=()=>{if(confirm('恢复全部演示数据？这会清除你在本演示中所做的修改。')){data=structuredClone(initial);save();search='';render();notice('演示数据已恢复')}};$('#tour').onclick=()=>{page='scenario';search='';render();notice('请按步骤完成模拟配置与请求。')};initScenario();initLab();initModuleExercise();render();
</script></body></html>
